name: Release

# Push a tag such as v0.3.2 (matching the version in pyproject.toml) to publish:
#   - a GitHub release with the wheel and the source archive, with the matching
#     section of CHANGELOG.md as release notes
#   - the same files on PyPI, once this workflow is registered as a "trusted
#     publisher" on pypi.org and the repository variable PYPI_PUBLISH is "true"
#
# It can also be run by hand ("Run workflow") for an existing tag, e.g. to put
# an earlier release on PyPI; an existing GitHub release is then left alone.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v0.3.2
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$TAG" || { echo "pyproject.toml says $version, tag is $TAG"; exit 1; }
      - name: Build wheel and source archive
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Smoke test the wheel
        run: |
          python -m pip install dist/*.whl
          aula-f87-control --help
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v tag="$TAG" '
            /^## / { if (found) exit; if (index($0, tag)) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for $TAG"; exit 1; }
          cat notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it as it is."
          else
            gh release create "$TAG" artifacts/dist/* --repo "$GITHUB_REPOSITORY" \
              --title "AULA F87 Control $TAG" --notes-file artifacts/notes/notes.md
          fi

  pypi:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aula-f87-control/
    permissions:
      id-token: write   # trusted publishing: no PyPI password or token is stored
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
