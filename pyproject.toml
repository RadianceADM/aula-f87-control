[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aula-f87-control"
version = "0.3.2"
description = "Backlight effects, per-key colors, music sync, sleep timer and battery level for AULA F87 / F87 Pro keyboards, on Linux and Windows"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "RadianceADM" }]
keywords = ["aula", "f87", "keyboard", "rgb", "backlight", "music", "linux", "windows", "hid"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "numpy",                                # music sync
    "hidapi; sys_platform != 'linux'",      # USB HID on Windows/macOS (Linux uses hidraw directly)
    "soundcard; sys_platform != 'linux'",   # audio capture on Windows/macOS (Linux uses pw-record)
]

[project.urls]
Homepage = "https://github.com/RadianceADM/aula-f87-control"
Issues = "https://github.com/RadianceADM/aula-f87-control/issues"

[project.scripts]
aula-f87-control = "aula_f87.__main__:main"

[project.gui-scripts]
aula-f87-control-gui = "aula_f87.__main__:gui_main"

[tool.setuptools]
packages = ["aula_f87"]

[tool.setuptools.package-data]
aula_f87 = ["data/*.svg"]
